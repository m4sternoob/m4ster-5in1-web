name: Capacitor Android


on:
  push:
    tags: ["v*"]
  workflow_dispatch:


permissions:
  contents: write


jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4


      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm


      - run: npm ci
      - run: npm run build


      - name: Capacitor sync Android
        run: |
          npx cap add android
          npx cap sync android
      - name: Apply launcher icons
        run: |
          unzip -o android-res.zip -d /tmp/icons
          rm -f android/app/src/main/res/drawable/ic_launcher_foreground.xml android/app/src/main/res/drawable/ic_launcher_background.xml
          cp -r /tmp/icons/android-res/. android/app/src/main/res/


      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21


      - name: Build APKs
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease


      - uses: actions/upload-artifact@v4
        with:
          name: 5in1-android-apks
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk


      - name: Upload APKs to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/**/*.apk


      # TODO: real Play-store signing — add ANDROID_KEYSTORE_BASE64 / KEY_ALIAS / KEY_PASSWORD secrets
