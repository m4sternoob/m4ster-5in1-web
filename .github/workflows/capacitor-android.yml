name: Capacitor Android

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # NOTE: no package-lock.json committed (270KB over push limits) — npm install is intentional here
      - run: npm install
      - run: npm run build

      - name: Capacitor sync Android
        run: |
          npx cap add android
          npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build APKs
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: 6in1-android-apks
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk

      # TODO: real Play-store signing — add ANDROID_KEYSTORE_BASE64 / KEY_ALIAS / KEY_PASSWORD secrets
